name: fieldbook
description: "Fieldbook: an unofficial Pokémon field guide"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^4.0.3
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  google_fonts: ^8.2.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/catalog.graphql
